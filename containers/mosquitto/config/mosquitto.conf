persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Permite conexões sem senha (apenas para testes locais)
allow_anonymous true

# Escuta na porta padrão do MQTT
listener 1883 0.0.0.0

# WebSocket para o front-end web (portaria no navegador)
listener 9001 0.0.0.0
protocol websockets